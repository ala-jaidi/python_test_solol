services:
  - type: web
    name: podiatry-measurement-api
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: |
      pip install --upgrade pip &&
      pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: OMP_NUM_THREADS
        value: "2"
      - key: MKL_NUM_THREADS
        value: "2"
    disk:
      name: model-cache
      mountPath: /opt/render/project/src/sam_mobile
      sizeGB: 1
